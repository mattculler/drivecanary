<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}drivecanary{% endblock %}</title>
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/uPlot.min.css">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #f6f6f4; color: #222; }
  header { background: #1f2937; color: #eee; padding: 6px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  header .brand { color: #fbbf24; font-weight: 700; }
  header .brand img { height: 44px; width: 44px; vertical-align: middle; margin-right: 8px; }
  header small { color: #9ca3af; margin-left: auto; }
  main { padding: 12px 16px; max-width: 1400px; }
  h1 { font-size: 20px; margin: 4px 0 10px; } h2 { font-size: 16px; margin: 18px 0 6px; }
  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { padding: 5px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; text-align: left; white-space: nowrap; }
  th { background: #f3f4f6; font-weight: 600; position: sticky; top: 0; }
  td.wrap, th.wrap { white-space: normal; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 12px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: .03em; }
  .badge.big { font-size: 16px; padding: 4px 12px; }
  .v-ok { background: #15803d; } .v-warn { background: #d97706; } .v-fail { background: #dc2626; }
  .v-error { background: #7c3aed; } .v-stale { background: #0e7490; } .v-unknown { background: #9ca3af; } .v-skipped { background: #6b7280; }
  tr.r-fail td:first-child, tr.r-warn td:first-child { border-left: 4px solid; }
  tr.r-fail td:first-child { border-left-color: #dc2626; } tr.r-warn td:first-child { border-left-color: #d97706; }
  .summary { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 4px; }
  .summary .counts span { margin-right: 10px; } .summary .muted, .muted { color: #6b7280; }
  .problem { color: #b91c1c; font-weight: 600; }
  .why { color: #444; font-size: 12px; white-space: normal; max-width: 28em; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; background: #fff; padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 4px; }
  .kv dt { color: #6b7280; } .kv dd { margin: 0; }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .chart { background: #fff; border: 1px solid #e5e7eb; border-radius: 4px; padding: 6px; min-height: 190px; }
  .chart .u-title { font-size: 13px; font-weight: 600; }
  .chart .empty { color: #9ca3af; padding: 60px 0; text-align: center; }
  .windows { font-size: 14px; font-weight: 400; margin-left: 8px; }
  .windows a, .windows b { margin-right: 10px; } .windows b { color: #222; font-weight: 700; }
  details.howto { margin-top: 18px; background: #fff; border: 1px solid #e5e7eb; border-radius: 4px; padding: 8px 12px; }
  details.howto summary { cursor: pointer; font-weight: 600; }
  details.howto h3 { font-size: 14px; margin: 14px 0 4px; }
  details.howto pre { background: #f3f4f6; white-space: pre-wrap; word-break: break-all; }
  .chip-run { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11px; font-weight: 600; color: #1e40af;
    background: #dbeafe; border: 1px solid #93c5fd; margin-left: 4px; white-space: nowrap; }
  .plainlist { margin: 2px 0; padding-left: 18px; }
  pre { background: #fff; border: 1px solid #e5e7eb; padding: 8px; overflow-x: auto; font-size: 12px; }
  .kind { display: inline-block; font-size: 11px; padding: 0 5px; border: 1px solid #cbd5e1; border-radius: 3px; color: #475569; background: #f8fafc; margin-right: 4px; text-transform: uppercase; }
  a.plain { color: inherit; }
  @media (max-width: 600px) { main { padding: 8px; } th, td { padding: 4px 6px; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/static/logo-tile.png" alt="">drivecanary</a>
  <a href="/">drives</a>
  <a href="/hosts">hosts</a>
  <a href="/runs">runs</a>
  <small>{{ version }}</small>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/uPlot.iife.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
