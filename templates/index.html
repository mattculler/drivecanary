<!doctype html>
<html>
  <head>
    <title>PyvMind - Smarter than SMART&trade;!</title>

    <!-- Fpr the datagrid lib -->
    <link type="text/css" rel="stylesheet" href="/static/css/jsgrid.min.css" />
    <link type="text/css" rel="stylesheet" href="/static/css/jsgrid-theme.min.css" />
    
    <!-- Modal popup lib -->
    <link type="text/css" rel="stylesheet" href="/static/css/tingle.css" />

    <!-- No doy -->
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="/static/js/underscore.js"></script>

    <!-- Neato little filesize lib, lots of options -->
    <script type="text/javascript" src="https://cdn.filesizejs.com/filesize.js"></script>

    <!-- Modal popup lib -->
    <script type="text/javascript" src="/static/js/tingle.js"></script>

    <!-- Datagrid lib -->
    <script type="text/javascript" src="/static/js/jsgrid.js"></script>
    <script type="text/javascript" src="/static/js/jsgrid-pvymind-fields.js"></script>

    <script>
      blkdevs = {{ blkdevs | safe }};

      // Prefer the model_family, if it exists
      blkdevs.forEach(function(dev) {
        var model = dev.model;
        if (dev.model_family) {
          model = dev.model_family;
        }
        dev.nice_model = model;
      });

      $(document).ready(function() {
        $("#grid").jsGrid({
          width: "100%",
          height: "auto",
   
          inserting: false,
          editing: false,
          sorting: true,
//          paging: true,
   
          data: blkdevs,

          fields: [
            { name: "host", type: "text", width: "50", title: "Host" },
            { name: "kern_name", type: "text", width: "40", title: "Node" },
            { name: "size_bytes", type: "capacity", width: "50", title: "Size" },
            { name: "is_spinning_rust", type: "disktype", width: "50", title: "Disk Type" },
            { name: "nice_model", type: "text", width: "160", title: "Model" },
            { name: "serial", type: "text" },
            { name: "first_seen", type: "date", title: "First Seen" }
          ],

          rowClick: function(wrapt) {
            // Show evey field that is not shown in the main grid
            var propsToRemove = _.pluck(this.fields, "name");
            var fields = _.omit(wrapt.item, propsToRemove);

            var popup = new tingle.modal();
            var content = $("<table>");
            for (var key in fields) {
              content.append("<tr>").append([
                $("<td>" + key + "</td>"),
                $("<td>" + fields[key] + "</td>")
              ]);
            }
            popup.setContent(content[0]);
            popup.open();
          }
        }); 
      });
    </script>
  </head>
  <body>
    <h1>All Disks</h1>
    <div id="grid"></div>
  </body>
</html>
