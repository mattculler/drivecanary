[project]
name = "drivecanary"
version = "0.1.0"
description = "Drive health for a home LAN: SMART, pool state and trends from every host, on one page"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "structlog>=24.1",
    "rich>=13.7",
]

[project.scripts]
drivecanary = "drivecanary.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drivecanary"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# generated migrations: the autogenerated column lines run long
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/drivecanary"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
